name: CI

on:
  push:
    branches: [main]
  pull_request:

# One live run per ref: a newer push supersedes the older run outright.
# Without this, consecutive pushes evicted each other's *pending* jobs
# from the shared `isolation-db` group below (GitHub keeps at most one
# pending job per group and cancels the previous one — `cancel-in-
# progress: false` only protects the running job), so the db suite and
# the browser harness each got cancelled once per push pair.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm exec eslint src --max-warnings 0
      - run: pnpm test
      # INV-D1 is inside pnpm test (inv-d1.test.ts) — the ARC-11
      # CI-enforced cookie assertion. Do not remove.

  isolation:
    name: Cross-tenant isolation suite
    runs-on: ubuntu-latest
    # Shared dev database for now — serialize runs. TODO(founder):
    # provide NEON_API_KEY to switch to an ephemeral Neon branch per
    # run (TENANCY.md §11 target infrastructure).
    concurrency:
      group: isolation-db
      cancel-in-progress: false
    # ~3 min next to the database; the GitHub runner is in the US and the
    # shared dev database in the EU (~100 ms per round trip), so the same
    # suite takes 25–35 min here and the 5 s transaction budget / 30 s
    # per-test guard that are right locally are too tight — both are
    # widened below. TODO(founder): a CI-only Neon project in a US region
    # (throwaway test data only) brings this back to minutes. Never the
    # 6-hour default timeout.
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      FIELD_ENCRYPTION_KEY_ID: k1
      DB_TX_TIMEOUT_MS: "20000"
      DBTEST_TIMEOUT_MS: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec tsx prisma/seed.ts
      - run: pnpm test:db

  e2e:
    name: Browser harness (Playwright)
    runs-on: ubuntu-latest
    # Only after the cheap checks pass: this job provisions a real
    # tenant in the shared dev database and downloads a browser.
    # It also waits for the isolation suite, so that within one run the
    # two db-touching jobs are serialised by the DAG and never both sit
    # in the `isolation-db` group (where the second would evict the first).
    needs: [check, isolation]
    # Same shared dev database as the isolation suite — the two must
    # never run at once. The group is the cross-ref guard (a PR run vs a
    # `main` run); TENANCY.md §11 ephemeral-branch TODO applies here too.
    concurrency:
      group: isolation-db
      cancel-in-progress: false
    # The suite is ~15 min next to the database; on this link the first
    # full run was still going at 60 min (every assertion waits on the
    # database, and a failure retries). 120 is a ceiling, not a target —
    # the US-region CI database (PLAN §0) is the real fix.
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      FIELD_ENCRYPTION_KEY_ID: k1
      # The `next start` under test is as far from the database as the
      # isolation job is (see above).
      DB_TX_TIMEOUT_MS: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      # provisionTenant refuses to run without the permission catalog.
      - run: pnpm exec tsx prisma/seed.ts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Chromium only (~700 MB): the harness exists to catch DOM and
      # mount-time behaviour, not to certify browser coverage.
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts owns the server: `pnpm build && pnpm start`
      # with APP_URL pinned to the harness origin (Better Auth refuses a
      # foreign origin, INV-D2). Fixtures live in a throwaway tenant
      # (slug "e2e-…") that global-teardown removes.
      - run: pnpm test:e2e
      - name: Ensure the throwaway tenant is gone
        if: always()
        run: pnpm exec tsx e2e/fixtures/seed-cli.ts teardown .auth/seed.json
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
