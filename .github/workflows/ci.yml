name: CI

on:
  push:
    branches: [main]
    # A full run costs ~115 BILLABLE minutes (measured 2026-09-01:
    # check 1 + isolation 52 + e2e 62), and the allowance is account-wide
    # — 2,000 min/month on Free. A push that changes only prose cannot
    # change what CI verifies, so it must not start one. This replaces
    # the `[skip ci]` convention with something that cannot be
    # forgotten; the convention itself still works and stays documented
    # in PLAN §0 for the rare docs commit that also touches source.
    # NOTE: paths-ignore skips only when EVERY changed file matches, so a
    # push mixing docs and source still runs in full — which is correct.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # The manual escape hatch: re-run the pipeline against any ref without
  # inventing a no-op source commit to trigger it.
  workflow_dispatch:

# One live run per ref: a newer push supersedes the older run outright.
# Without this, consecutive pushes evicted each other's *pending* jobs
# from the shared `isolation-db` group below (GitHub keeps at most one
# pending job per group and cancels the previous one — `cancel-in-
# progress: false` only protects the running job), so the db suite and
# the browser harness each got cancelled once per push pair.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    # Runs in ~1 min and touches no database. Bounded like every other job
    # here: without this it inherits GitHub's 6-hour default, so one hung
    # unit test would burn six hours of billable minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      # `src e2e`, matching the command AGENTS.md pins. CI linted only
      # `src` until 2026-09-01, so a lint error in the Playwright specs
      # reached main unchallenged; the extra path costs ~2 seconds.
      - run: pnpm exec eslint src e2e --max-warnings 0
      - run: pnpm test
      # INV-D1 is inside pnpm test (inv-d1.test.ts) — the ARC-11
      # CI-enforced cookie assertion. Do not remove.

  isolation:
    name: Cross-tenant isolation suite
    runs-on: ubuntu-latest
    # A commit that cannot typecheck teaches us nothing about tenant
    # isolation, and this job costs ~50 BILLABLE minutes against the
    # remote database. Gating on the 1-minute check job makes a broken
    # push cost 1 minute instead of 52. It adds ~1 minute of WALL CLOCK
    # and zero billable minutes — queued time is not billed — so the
    # trade is free. (The e2e job already needed both.)
    needs: [check]
    # Shared dev database for now — serialize runs. TODO(founder):
    # provide NEON_API_KEY to switch to an ephemeral Neon branch per
    # run (TENANCY.md §11 target infrastructure).
    concurrency:
      group: isolation-db
      cancel-in-progress: false
    # ~3–4 min next to the database; the GitHub runner is in the US and the
    # shared dev database in the EU (~100 ms per round trip), so the same
    # suite takes 20–45+ min here and the 5 s transaction budget / 30 s
    # per-test guard that are right locally are too tight — both are
    # widened below. TODO(founder): an EU-located runner (a larger runner
    # with Azure private networking in an EU region, or an ephemeral
    # self-hosted one) brings this back to minutes — the database stays in
    # Frankfurt. Never the 6-hour default timeout.
    #
    # This ceiling is a HANG GUARD and a VARIANCE budget — not a budget the
    # suite must fit, and not a growth allowance. A hung test is caught by
    # DBTEST_TIMEOUT_MS (120 s) long before this fires; what this must
    # absorb is the link. Measured 2026-08-21: the SAME 22 dbtest files ran
    # 23 min and 42 min on two runs two hours apart — every file 1.5–1.8×
    # slower, fast and slow files alike, i.e. the runner↔database link, not
    # the suite. Test growth is ~4 min per slice by comparison. Run
    # 32491311123 was killed at 45 min in the slow regime with every test
    # passing and ~3 min of work left. 90 ≈ 1.9× the worst full run
    # observed. Cost of the raise: a genuinely hung job now holds the
    # isolation-db concurrency group (and the "no local Playwright while CI
    # runs" rule) for 90 min instead of 45; a ceiling costs nothing
    # otherwise, since it only fires on overrun.
    # When 90 is approached it will most likely be another bad-link day, not
    # accumulated tests — do NOT raise it again. The two structural fixes
    # solve DIFFERENT problems: the EU-located runner above fixes speed and
    # variance (the dominant term); the ephemeral Neon branch per run
    # (TODO(founder) NEON_API_KEY, above) fixes serialization — it would let
    # isolation and e2e run in parallel, retire this concurrency group, and
    # only then make sharding possible (a strategy.matrix inside THIS job
    # would share one group and evict its own shards) or file parallelism
    # (vitest.db.config.ts is sequential because the database is shared).
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      FIELD_ENCRYPTION_KEY_ID: k1
      DB_TX_TIMEOUT_MS: "20000"
      DBTEST_TIMEOUT_MS: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec tsx prisma/seed.ts
      - run: pnpm test:db

  e2e:
    name: Browser harness (Playwright)
    runs-on: ubuntu-latest
    # Only after the cheap checks pass: this job provisions a real
    # tenant in the shared dev database and downloads a browser.
    # It also waits for the isolation suite, so that within one run the
    # two db-touching jobs are serialised by the DAG and never both sit
    # in the `isolation-db` group (where the second would evict the first).
    needs: [check, isolation]
    # Same shared dev database as the isolation suite — the two must
    # never run at once. The group is the cross-ref guard (a PR run vs a
    # `main` run); TENANCY.md §11 ephemeral-branch TODO applies here too.
    concurrency:
      group: isolation-db
      cancel-in-progress: false
    # The suite is ~15 min next to the database; on this link the first
    # full run was still going at 60 min (every assertion waits on the
    # database, and a failure retries). 120 is a ceiling, not a target —
    # an EU-located runner (PLAN §0) is the real fix.
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      FIELD_ENCRYPTION_KEY_ID: k1
      # The `next start` under test is as far from the database as the
      # isolation job is (see above).
      DB_TX_TIMEOUT_MS: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      # provisionTenant refuses to run without the permission catalog.
      - run: pnpm exec tsx prisma/seed.ts
      # The cache key must describe the BROWSER, not the dependency tree:
      # keyed on pnpm-lock.yaml (as it was until 2026-09-01) every
      # unrelated dependency bump threw away ~700 MB of Chromium and
      # re-downloaded it. Resolving the version needs node_modules, so
      # this step sits after install — but still BEFORE the install of
      # the browser itself, which is what matters: a cache restores at
      # its own step position, so moving it below `playwright install`
      # would download the browser every run while faithfully writing a
      # cache nothing ever reads. No restore-keys on purpose: a
      # near-miss would restore some OTHER version's browsers, which
      # `playwright install` then has to supersede anyway.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Chromium only (~700 MB): the harness exists to catch DOM and
      # mount-time behaviour, not to certify browser coverage.
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts owns the server: `pnpm build && pnpm start`
      # with APP_URL pinned to the harness origin (Better Auth refuses a
      # foreign origin, INV-D2). Fixtures live in a throwaway tenant
      # (slug "e2e-…") that global-teardown removes.
      - run: pnpm test:e2e
      - name: Ensure the throwaway tenant is gone
        if: always()
        run: pnpm exec tsx e2e/fixtures/seed-cli.ts teardown .auth/seed.json
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
